# Pull requests from forks cannot be trusted with secrets,
# so a preview deploy happens in two workflows:
#
#   1. CI (pull_request) runs the code of the PR with no secrets,
#      builds the site, and uploads the `deploy-prep-dist` artifact.
#   2. This workflow (workflow_run) has the secrets,
#      and never checks out or runs anything from the PR.
#      It downloads the artifact, deploys it, and posts a comment.
#
# The PR number, branch, and sha come from the GitHub API and not from the artifact,
# because a PR controls the contents of its artifact.
#
# The author of a PR chooses the branch name,
# so the name only goes through quoted env vars, and never directly in a script.
#
# GitHub runs this file from the default branch,
# so a change to this file has no effect until it merges.
#
# More information:
#   https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
name: Deploy Preview

on:
  workflow_dispatch:
    inputs:
      prNumber:
        required: true
        description: Which PR to create a preview for

  workflow_run:
    workflows: ["CI"]
    types:
      - completed

concurrency:
  # pull_requests[] is empty for fork PRs, so fall back to the head sha
  group: deploy-preview-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || github.event.inputs.prNumber || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  determinePR:
    runs-on: ubuntu-latest
    if: (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success') || github.event.inputs.prNumber
    permissions:
      pull-requests: read
      actions: read
    outputs:
      number: ${{ steps.pr-info.outputs.number }}
      branch: ${{ steps.pr-info.outputs.branch }}
      sha: ${{ steps.pr-info.outputs.sha }}
      run-id: ${{ steps.pr-info.outputs.run-id }}
      subdomain: ${{ steps.pr-info.outputs.subdomain }}
    steps:
      - id: pr-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR_NUM: ${{ github.event.inputs.prNumber }}
          EVENT_PR_NUM: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "$INPUT_PR_NUM" ]; then
            PR_NUM="$INPUT_PR_NUM"
          else
            PR_NUM="$EVENT_PR_NUM"
            if [ -z "$PR_NUM" ]; then
              PR_NUM=$(gh pr list --repo "$REPOSITORY" --json number,headRefOid \
                --jq ".[] | select(.headRefOid == \"$HEAD_SHA\") | .number")
            fi
          fi

          if ! [[ "$PR_NUM" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine a PR number (got: '$PR_NUM')"
            exit 1
          fi

          PR_JSON=$(gh pr view "$PR_NUM" --repo "$REPOSITORY" --json headRefName,headRefOid)
          BRANCH=$(echo "$PR_JSON" | jq -r '.headRefName')
          SHA="${HEAD_SHA:-$(echo "$PR_JSON" | jq -r '.headRefOid')}"

          # workflow_dispatch has no triggering run, so find the CI run for the head commit
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$REPOSITORY" --workflow ci.yml \
              --commit "$SHA" --event pull_request --status success \
              --json databaseId,createdAt --jq 'sort_by(.createdAt) | last | .databaseId')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful CI run found for $SHA"
            exit 1
          fi

          # The branch alias on Cloudflare: lowercase [a-z0-9-], at most 28 characters
          SUBDOMAIN=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | cut -c -28)
          SUBDOMAIN="${SUBDOMAIN%-}"
          SUBDOMAIN="${SUBDOMAIN#-}"

          echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "subdomain=$SUBDOMAIN" >> "$GITHUB_OUTPUT"

  DeployPreview:
    name: "Deploy: Preview"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [determinePR]
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-prep-dist
          path: ./deploy-prep-dist
          run-id: ${{ needs.determinePR.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Preview
        working-directory: ./deploy-prep-dist
        run: |
          npx wrangler pages deploy ./ \
            --project-name="$PROJECT_NAME" \
            --branch="$BRANCH" \
            --commit-hash="$HEAD_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT_NAME: nullvoxpopuli-dot-com
          BRANCH: ${{ needs.determinePR.outputs.branch }}
          HEAD_SHA: ${{ needs.determinePR.outputs.sha }}

  PostComment:
    name: Post Preview URL as comment to PR
    runs-on: ubuntu-latest
    needs: [DeployPreview, determinePR]
    permissions:
      pull-requests: write
    steps:
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview-urls
          number: ${{ needs.determinePR.outputs.number }}
          message: |+
            Preview: https://${{ needs.determinePR.outputs.subdomain }}.nullvoxpopuli-dot-com.pages.dev

            [Logs](https://github.com/NullVoxPopuli/website/actions/runs/${{ github.run_id }})
