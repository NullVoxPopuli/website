name: Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request: {}

concurrency:
   group: deploy-${{ github.head_ref || github.ref }}
   cancel-in-progress: true

env:
  TURBO_API: http://127.0.0.1:9080
  TURBO_TOKEN: this-is-not-a-secret
  TURBO_TEAM: myself

jobs:
  DeployProduction:
    name: "Deploy: Production"
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app:
        - { path: "./dist", cloudflareName: "nullvoxpopuli-dot-com", name: "docs" }


    permissions:
      contents: read
      deployments: write

    steps:
      - uses: wyvox/action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm build
      - name: Publish ${{ matrix.app.name }}
        working-directory: ${{ matrix.app.path }}
        run: |
          npx wrangler pages deploy ./ \
            --project-name="$PROJECT_NAME" \
            --branch="$BRANCH" \
            --commit-hash="$HEAD_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT_NAME: ${{ matrix.app.cloudflareName }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
